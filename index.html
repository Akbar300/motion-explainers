<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff8ee">
  <meta name="description" content="A short motion story that shows how a fraction becomes a percent.">
  <title>From a Fraction to a Percent</title>
  <link rel="icon" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=IBM+Plex+Mono:wght@600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="shell">
    <header class="top">
      <h1>From a Fraction to a Percent</h1>
      <div class="dots" id="dots" role="tablist" aria-label="Scenes"></div>
    </header>

    <main class="stage-wrap">
      <div class="stage-card" id="stage" aria-live="polite"></div>
    </main>

    <aside class="side">
      <div class="callout" id="callout"></div>
      <p class="caption" id="caption"></p>
    </aside>

    <nav class="controls" aria-label="Playback">
      <button type="button" class="btn" id="btn-back" aria-label="Back">Back</button>
      <button type="button" class="btn teal" id="btn-play" aria-label="Pause">Pause</button>
      <button type="button" class="btn" id="btn-next" aria-label="Next">Next</button>
      <button type="button" class="btn" id="btn-replay" aria-label="Replay this scene">Replay</button>
      <button type="button" class="btn" id="btn-speed" aria-label="Playback speed, currently 1 times">1×</button>
    </nav>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
